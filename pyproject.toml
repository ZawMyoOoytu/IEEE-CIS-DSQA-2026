[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "ieee-cis-dsqa-2026"
version = "0.1.0"
description = "Research workspace for the IEEE CIS 2026 DSQA Technical Challenge"
requires-python = ">=3.13,<3.14"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]