project:
  name: "IEEE-CIS-DSQA-2026"
  version: "0.1.0"
  author: "ZawMyo Oo"

challenge:
  target_domains:
    - "IFMIF-DONES"
    - "specialized AI research literature"

  constraints:
    fixed_model: true
    single_gpu: true
    gpu_class: "H100"
    max_wall_clock_minutes: 60
    max_submission_size_mb: 1024
    internet_at_evaluation: false

pipeline:
  stages:
    - question_analysis
    - adaptive_retrieval
    - evidence_scoring
    - reasoning
    - verification
    - final_answer

retrieval:
  initial_top_k: 5
  max_top_k: 12
  min_score: 0.0
  enable_bm25: true
  enable_dense: false
  enable_reranking: false

routing:
  factual:
    top_k: 3
    verification: false

  comparative:
    top_k: 5
    verification: true

  procedural:
    top_k: 6
    verification: true

  causal:
    top_k: 8
    verification: true

  predictive:
    top_k: 10
    verification: true

trust:
  enabled: true
  relevance_weight: 0.40
  source_weight: 0.30
  consistency_weight: 0.20
  freshness_weight: 0.10

verification:
  enabled: true
  min_evidence_score: 0.60
  require_citation: true

experiments:
  random_seed: 42
  save_outputs: true